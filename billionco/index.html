<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Billion Co – киім және аяқ киім. Қазақстан бойынша жеткізу, Kaspi арқылы төлем.">
  <title>Billion Co – киім және аяқ киім</title>

  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="concept" id="concept">
    <div class="container concept-row">
      <span data-text="concept"></span>
      <button type="button" id="hideConcept" data-text="hide"></button>
    </div>
  </div>

  <header class="header" id="header">
    <div class="container header-row">
      <nav class="nav">
        <a href="#catalog" data-nav="catalog" data-go="all" data-text="navCatalog"></a>
        <a href="#new" data-nav="new" data-text="navNew"></a>
        <a href="#lookbook" data-nav="lookbook" data-text="navLookbook"></a>
        <a href="#about" data-nav="about" data-text="navAbout"></a>
        <a href="#contacts" data-nav="contacts" data-text="navContacts"></a>
      </nav>

      <button class="icon burger" type="button" id="burger" aria-label="Menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h16M4 16h16"/></svg>
      </button>

      <a class="brand" href="#home" aria-label="Billion Co">
        <img class="brand-dark" src="img/wordmark-navy.png" alt="BILLION.CO">
        <img class="brand-light" src="img/wordmark-white.png" alt="">
      </a>

      <div class="header-right">
        <div class="lang">
          <button type="button" data-lang="kz">ҚАЗ</button>
          <button type="button" data-lang="ru">РУС</button>
        </div>
        <a class="icon" href="#catalog" id="searchBtn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </a>
        <a class="icon icon-cart" href="#cart" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <b id="cartCount">0</b>
        </a>
      </div>
    </div>

    <nav class="container mobile-nav" id="mobileNav" hidden>
      <a href="#catalog" data-go="all" data-text="navCatalog"></a>
      <a href="#new" data-text="navNew"></a>
      <a href="#lookbook" data-text="navLookbook"></a>
      <a href="#about" data-text="navAbout"></a>
      <a href="#delivery" data-text="deliveryTitle"></a>
      <a href="#sizes" data-text="sizeTable"></a>
      <a href="#contacts" data-text="navContacts"></a>
      <a href="#cart" data-text="navCart"></a>
    </nav>
  </header>

  <main>

    <div class="view" data-view="home">
      <section class="hero" id="hero">
        <img class="hero-photo" src="photos/hero.jpg" alt="" onerror="this.remove()">
        <div class="hero-wall" id="heroWall" aria-hidden="true"></div>
        <div class="hero-shade"></div>
        <img class="hero-logo" src="img/logo-white.png" alt="Billion Co">
        <div class="container hero-bottom">
          <div>
            <p class="hero-eyebrow" data-text="heroEyebrow"></p>
            <h1 data-text="heroTitle"></h1>
          </div>
          <div class="buttons">
            <a class="btn btn-white" href="#catalog" data-go="all" data-text="heroBtn"></a>
            <a class="btn btn-outline-white" href="#new" data-text="navNew"></a>
          </div>
        </div>
      </section>

      <div class="infobar" aria-hidden="false">
        <div class="marquee">
          <div class="marquee-group"><span data-text="info1"></span><i>✦</i><span data-text="info2"></span><i>✦</i><span data-text="info3"></span><i>✦</i><span>Billion.co</span><i>✦</i></div>
          <div class="marquee-group" aria-hidden="true"><span data-text="info1"></span><i>✦</i><span data-text="info2"></span><i>✦</i><span data-text="info3"></span><i>✦</i><span>Billion.co</span><i>✦</i></div>
          <div class="marquee-group" aria-hidden="true"><span data-text="info1"></span><i>✦</i><span data-text="info2"></span><i>✦</i><span data-text="info3"></span><i>✦</i><span>Billion.co</span><i>✦</i></div>
          <div class="marquee-group" aria-hidden="true"><span data-text="info1"></span><i>✦</i><span data-text="info2"></span><i>✦</i><span data-text="info3"></span><i>✦</i><span>Billion.co</span><i>✦</i></div>
        </div>
      </div>

      <section>
        <div class="container head">
          <h2 data-text="newTitle"></h2>
          <div class="arrows">
            <button type="button" data-scroll="homeNew" data-dir="-1" aria-label="Prev">←</button>
            <button type="button" data-scroll="homeNew" data-dir="1" aria-label="Next">→</button>
          </div>
        </div>
        <div class="row-scroll drag-row" id="homeNew" data-autoplay="1"></div>
        <div class="container row-end">
          <a class="btn btn-dark" href="#new" data-text="shopNow"></a>
        </div>
      </section>


      <section class="section-tight">
        <div class="container head">
          <h2 data-text="catsTitle"></h2>
          <a class="link" href="#catalog" data-go="all" data-text="allGoods"></a>
        </div>
        <div class="cats drag-row" id="catTiles"></div>
      </section>

      <section class="section-tight">
        <div class="container head">
          <h2 data-text="looksTitle"></h2>
          <a class="link" href="#lookbook" data-text="allLooks"></a>
        </div>
        <div class="container looks" id="homeLooks"></div>
      </section>

      <section class="section-tight ig-section">
        <div class="container head">
          <div>
            <h2>@billion.co.official</h2>
            <p class="subtitle" data-text="igText"></p>
          </div>
          <a class="btn btn-dark" href="https://instagram.com/billion.co.official" target="_blank" rel="noopener" data-text="igBtn"></a>
        </div>
        <div class="ig-row drag-row" id="igHome" data-autoplay="1"></div>
      </section>

      <section class="section-tight">
        <div class="container head">
          <div>
            <h2 data-text="shopsTitle"></h2>
            <p class="subtitle" data-text="hoursValue"></p>
          </div>
          <a class="link" href="#contacts" data-text="navContacts"></a>
        </div>
        <div class="container stores" id="homeStores"></div>
      </section>

      <section class="section-tight">
        <div class="container perks">
          <a class="perk" href="#delivery"><b data-text="perk1"></b><span data-text="perk1Text"></span></a>
          <a class="perk" href="#delivery"><b data-text="perk2"></b><span data-text="perk2Text"></span></a>
          <a class="perk" href="#sizes"><b data-text="perk3"></b><span data-text="perk3Text"></span></a>
          <a class="perk" href="#delivery"><b data-text="perk4"></b><span data-text="perk4Text"></span></a>
        </div>
      </section>

      <section class="section-tight">
        <div class="container">
          <div class="band">
            <img src="img/emblem-white.png" alt="">
            <div>
              <h2 data-text="bandTitle"></h2>
              <p data-text="bandText"></p>
            </div>
            <a class="btn btn-white" id="bandWa" href="#" target="_blank" rel="noopener" data-text="writeWa"></a>
          </div>
        </div>
      </section>
    </div>

    <div class="view" data-view="catalog" hidden>
      <section class="page-top">
        <div class="container">
          <h1 class="page-title" id="catalogTitle"></h1>
          <div class="toolbar">
            <div class="chips" id="chips"></div>
            <div class="tools">
              <input class="input" id="search" type="search" data-ph="searchPh" aria-label="Search">
              <select class="input" id="sort" aria-label="Sort"></select>
            </div>
          </div>
          <div class="grid" id="catalogGrid"></div>
          <div class="more" id="catalogMore" hidden>
            <button type="button" class="btn" id="catalogMoreBtn" data-text="showMore"></button>
          </div>
        </div>
      </section>
    </div>

    <div class="view" data-view="new" hidden>
      <section class="page-top">
        <div class="container">
          <h1 class="page-title" data-text="newPageTitle"></h1>
          <p class="subtitle" data-text="newPageText"></p>
          <div class="grid" id="newGrid"></div>
          <div class="more" id="newMore" hidden>
            <button type="button" class="btn" id="newMoreBtn" data-text="showMore"></button>
          </div>
        </div>
      </section>
    </div>

    <div class="view" data-view="product" hidden>
      <section class="page-top product-section">
        <div class="product" id="productPage"></div>
      </section>
      <section class="section-tight">
        <div class="container head">
          <h2 data-text="mayLike"></h2>
          <div class="arrows">
            <button type="button" data-scroll="related" data-dir="-1" aria-label="Prev">←</button>
            <button type="button" data-scroll="related" data-dir="1" aria-label="Next">→</button>
          </div>
        </div>
        <div class="row-scroll drag-row" id="related"></div>
      </section>
      <section class="section-tight ig-section">
        <div class="container head">
          <h2>@billion.co.official</h2>
          <a class="btn btn-dark" href="https://instagram.com/billion.co.official" target="_blank" rel="noopener" data-text="igBtn"></a>
        </div>
        <div class="ig-row drag-row" id="igProduct" data-autoplay="1"></div>
      </section>
    </div>

    <div class="view" data-view="lookbook" hidden>
      <section class="page-top">
        <div class="container">
          <h1 class="page-title" data-text="lookPageTitle"></h1>
          <p class="subtitle" data-text="lookPageText"></p>
          <div class="looks" id="looksList"></div>
        </div>
      </section>
    </div>

    <div class="view" data-view="about" hidden>
      <section class="page-top">
        <div class="container about-hero">
          <div class="about-text">
            <p class="eyebrow" data-text="navAbout"></p>
            <h1 class="page-title" data-text="aboutTitle"></h1>
            <p class="about-lead" data-text="aboutLead"></p>
            <div class="buttons">
              <a class="btn btn-dark" href="#catalog" data-go="all" data-text="aboutBtn"></a>
              <a class="btn wa-link" href="#" target="_blank" rel="noopener" data-text="writeWa"></a>
            </div>
          </div>
          <div class="about-collage" id="aboutCollage"></div>
        </div>
      </section>

      <section class="section-tight">
        <div class="container stats" id="aboutStats"></div>
      </section>

      <section class="section-tight">
        <div class="container">
          <div class="about-quote">
            <img src="img/emblem-white.png" alt="">
            <p class="quote" data-text="aboutQuote"></p>
            <p class="quote-sub" data-text="aboutQuoteSub"></p>
          </div>
        </div>
      </section>

      <section class="section-tight">
        <div class="container head">
          <h2 data-text="whyTitle"></h2>
        </div>
        <div class="container cards4">
          <div class="icard"><i>I</i><b data-text="q1"></b><span data-text="q1Text"></span></div>
          <div class="icard"><i>II</i><b data-text="q2"></b><span data-text="q2Text"></span></div>
          <div class="icard"><i>III</i><b data-text="q3"></b><span data-text="q3Text"></span></div>
          <div class="icard"><i>IV</i><b data-text="q4"></b><span data-text="q4Text"></span></div>
        </div>
      </section>

      <section class="section-tight">
        <div class="container head">
          <h2 data-text="catsTitle"></h2>
          <a class="link" href="#catalog" data-go="all" data-text="allGoods"></a>
        </div>
        <div class="cats drag-row" id="aboutCats"></div>
      </section>
    </div>

    <div class="view" data-view="delivery" hidden>
      <section class="page-top">
        <div class="container narrow">
          <h1 class="page-title" data-text="deliveryTitle"></h1>

          <h3 class="h3" data-text="navDelivery"></h3>
          <div class="table-box" id="deliveryTable"></div>
          <p class="note" id="freeNote"></p>

          <h3 class="h3" data-text="payTitle"></h3>
          <div class="cards3 cards-flat">
            <div class="icard"><i>Kaspi</i><b data-text="pay1"></b><span data-text="pay1Text"></span></div>
            <div class="icard"><i>0·0·12</i><b data-text="pay2"></b><span data-text="pay2Text"></span></div>
            <div class="icard"><i>₸</i><b data-text="pay3"></b><span data-text="pay3Text"></span></div>
          </div>

          <h3 class="h3" data-text="returnTitle"></h3>
          <div class="prose"><p data-text="returnText"></p></div>
        </div>
      </section>
    </div>

    <div class="view" data-view="sizes" hidden>
      <section class="page-top">
        <div class="container narrow">
          <h1 class="page-title" data-text="sizeTable"></h1>
          <div class="cols">
            <div>
              <h3 class="h3" data-text="sizesClothes"></h3>
              <div class="table-box" id="tableClothes"></div>
            </div>
            <div>
              <h3 class="h3" data-text="sizesJeans"></h3>
              <div class="table-box" id="tableJeans"></div>
            </div>
            <div>
              <h3 class="h3" data-text="sizesShoes"></h3>
              <div class="table-box" id="tableShoes"></div>
            </div>
            <div>
              <h3 class="h3" data-text="measureTitle"></h3>
              <ol class="measure">
                <li data-text="m1"></li>
                <li data-text="m2"></li>
                <li data-text="m3"></li>
                <li data-text="m4"></li>
              </ol>
              <p class="note" data-text="measureTip"></p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="view" data-view="contacts" hidden>
      <section class="page-top">
        <div class="container two">
          <div>
            <h1 class="page-title" data-text="faqTitle"></h1>
            <div class="faq" id="faqList"></div>
          </div>

          <div class="contact">
            <img src="img/emblem-navy.png" alt="">
            <div><span class="label">WhatsApp</span><b>+7 701 741 01 64</b></div>
            <div><span class="label">Instagram</span><a class="contact-link" href="https://instagram.com/billion.co.official" target="_blank" rel="noopener">@billion.co.official</a></div>
            <div><span class="label" data-text="hours"></span><b data-text="hoursValue"></b></div>
            <div><span class="label" data-text="shopsTitle"></span><div class="store-list" id="contactStores"></div></div>
            <a class="btn btn-dark" id="contactWa" href="#" target="_blank" rel="noopener" data-text="writeWa"></a>
            <a class="btn" href="tel:+77017410164" data-text="call"></a>
          </div>
        </div>
      </section>
    </div>

    <div class="view" data-view="cart" hidden>
      <section class="page-top">
        <div class="container">
          <h1 class="page-title" data-text="navCart"></h1>
          <div class="cart">
            <div class="cart-lines" id="cartLines"></div>

            <form class="summary" id="orderForm">
              <p class="free" id="freeMsg"></p>
              <div class="sum-row"><span data-text="goods"></span><span id="sumGoods">0 ₸</span></div>
              <div class="sum-row"><span data-text="navDelivery"></span><span id="sumShip">0 ₸</span></div>
              <div class="sum-row sum-total"><span data-text="total"></span><span id="sumTotal">0 ₸</span></div>

              <div class="field">
                <label for="nameInput" data-text="nameLabel"></label>
                <input class="input" id="nameInput" required autocomplete="name">
              </div>
              <div class="field">
                <label for="phoneInput" data-text="phoneLabel"></label>
                <input class="input" id="phoneInput" type="tel" required placeholder="+7" autocomplete="tel">
              </div>
              <div class="field">
                <label for="cityInput" data-text="cityLabel"></label>
                <select class="input" id="cityInput"></select>
              </div>
              <div class="field">
                <label for="addressInput" data-text="addressLabel"></label>
                <input class="input" id="addressInput" required>
              </div>
              <div class="field">
                <label for="payInput" data-text="payTitle"></label>
                <select class="input" id="payInput"></select>
              </div>

              <button class="btn btn-dark" type="submit" id="sendOrder" data-text="sendOrder"></button>
              <p class="note" data-text="sendHint"></p>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-row">
      <div class="footer-brand">
        <img src="img/logo-white.png" alt="Billion Co">
        <p data-text="footerText"></p>
        <p class="footer-hours"><span data-text="hoursValue"></span><br>+7 701 741 01 64</p>
      </div>
      <div>
        <b data-text="navCatalog"></b>
        <div id="footerCats"></div>
      </div>
      <div>
        <b data-text="buyers"></b>
        <a href="#delivery" data-text="deliveryTitle"></a>
        <a href="#sizes" data-text="sizeTable"></a>
        <a href="#cart" data-text="navCart"></a>
      </div>
      <div>
        <b data-text="company"></b>
        <a href="#about" data-text="navAbout"></a>
        <a href="#lookbook" data-text="navLookbook"></a>
        <a href="#contacts" data-text="navContacts"></a>
        <a href="https://instagram.com/billion.co.official" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
    <div class="container copyright">
      <span>© 2026 Billion Co.</span>
      <span data-text="madeBy"></span>
    </div>
  </footer>

  <div class="sticky-buy" id="stickyBuy" hidden></div>

  <div class="zoom" id="zoom" hidden>
    <button type="button" class="zoom-close" id="zoomClose" aria-label="Close">✕</button>
    <div class="zoom-img" id="zoomImg"></div>
  </div>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg width="26" height="26" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
  </a>

  <div class="toast" id="toast" hidden></div>

  <script src="products-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
